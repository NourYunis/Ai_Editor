<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;background:#fff;color:#1d2433}
  #wrap{padding:8px;border:1px solid #d9dee8;border-radius:10px}
  canvas{width:100%;height:80px;display:block;background:#f6f8fb;border-radius:6px;cursor:pointer}
  audio{width:100%;margin-top:6px}
  #bar{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:14px}
  #bar button,#bar select{padding:4px 10px;border:1px solid #c5ccd9;border-radius:6px;background:#fff;cursor:pointer}
  #hint{margin-left:auto;color:#6b7589;font-size:12px}
  #tx{position:relative;height:470px;overflow-y:auto;border-top:1px solid #e3e7ef}
  .seg{padding:6px 10px;font-size:21px;line-height:1.9;border-bottom:1px solid #f0f2f6}
  .seg.cur{background:#eaf2ff}
  .seg.selseg{background:#fff4d6;box-shadow:inset 4px 0 0 #ffb300}
  .idx{font-size:12px;background:#e8ecf4;color:#44506a;border-radius:10px;padding:1px 8px;margin:0 6px;cursor:pointer;user-select:none}
  .seg.chg .idx{background:#d3f2da;color:#17632b}
  .seg.pend .idx{background:#ffe9a8;color:#7a5200}
  .idx:hover{background:#cfd8ea}
  .w{cursor:pointer;border-radius:4px;padding:0 2px}
  .w:hover{background:#ffe08a}
  .w.selw{background:#ffb300;color:#000}
</style></head>
<body><div id="wrap">
  <canvas id="wave" height="80"></canvas>
  <audio id="au" controls></audio>
  <div id="bar">
    <button id="prev">⏮ Sentence</button><button id="next">Sentence ⏭</button>
    <select id="spd"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option></select>
    <label><input type="checkbox" id="follow" checked> Follow playback</label>
    <span id="diag" style="color:#b3162d"></span><span id="hint">Click a word = select it · double-click = play sentence · ▶ number = play sentence</span>
  </div>
  <div id="tx"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const au = $("au"), cv = $("wave"), tx = $("tx"), g = cv.getContext("2d");
let DUR = 1, K = 1, segs = [], segKey = "", ver = null, peaks = null, cur = -1, selI = -1, resumeT = 0, resumePlay = false;
const post = (type, extra) => window.parent.postMessage(Object.assign({isStreamlitMessage: true, type}, extra || {}), "*");

function build() {
  const keep = tx.scrollTop;
  tx.innerHTML = ""; selI = -1; cur = -1;
  segs.forEach((s, i) => {
    const d = document.createElement("div");
    d.className = "seg" + (s.pend ? " pend" : "") + (s.chg ? " chg" : ""); d.id = "s" + i; d.dir = "auto";
    const b = document.createElement("span");
    b.className = "idx"; b.textContent = (s.pend ? "⏳ " : s.chg ? "✎ " : "▶ ") + (s.id + 1); b.dataset.i = i; d.appendChild(b);
    s.text.split(/\s+/).filter(Boolean).forEach((w, k) => {
      const sp = document.createElement("span");
      sp.className = "w"; sp.textContent = w; sp.dataset.i = i; sp.dataset.k = k;
      d.appendChild(sp); d.appendChild(document.createTextNode(" "));
    });
    tx.appendChild(d);
  });
  tx.scrollTop = keep;
}

function select(i, k, word) {
  document.querySelectorAll(".selseg").forEach(e => e.classList.remove("selseg"));
  document.querySelectorAll(".selw").forEach(e => e.classList.remove("selw"));
  selI = i;
  $("s" + i).classList.add("selseg");
  if (k !== null) tx.querySelector(`.w[data-i="${i}"][data-k="${k}"]`).classList.add("selw");
  post("streamlit:setComponentValue", {dataType: "json",
       value: {sid: segs[i].id, wi: k, word: word, n: Date.now()}});
}
const seek = t => { au.currentTime = Math.max(0, t); };
const playSeg = i => { seek(segs[i].start_ms / 1000 * K); au.play(); };

tx.addEventListener("click", e => {
  const t = e.target; if (!t.dataset || t.dataset.i === undefined) return;
  const i = +t.dataset.i;
  if (t.classList.contains("idx")) { select(i, null, null); playSeg(i); }
  else if (t.classList.contains("w")) select(i, +t.dataset.k, t.textContent);
});
tx.addEventListener("dblclick", e => {
  if (e.target.classList.contains("w")) playSeg(+e.target.dataset.i);
});
cv.addEventListener("click", e => {
  const r = cv.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * DUR * K);
});
$("prev").onclick = () => playSeg(Math.max(0, (cur < 0 ? 0 : cur) - 1));
$("next").onclick = () => playSeg(Math.min(segs.length - 1, (cur < 0 ? -1 : cur) + 1));
$("spd").onchange = e => { au.playbackRate = +e.target.value; };
au.addEventListener("play", () => { au.playbackRate = +$("spd").value; });

function segAt(t) {  // t in timeline seconds
  const ms = t * 1000;
  for (let i = segs.length - 1; i >= 0; i--) if (segs[i].start_ms <= ms) return ms < segs[i].end_ms + 50 ? i : -1;
  return -1;
}

function draw() {
  const W = cv.clientWidth, H = cv.height; if (cv.width !== W) cv.width = W;
  g.clearRect(0, 0, W, H);
  const dur = DUR || au.duration || 1;
  const shade = (i, c) => { if (i < 0 || !segs[i]) return; g.fillStyle = c;
    g.fillRect(segs[i].start_ms / 1000 / dur * W, 0, (segs[i].end_ms - segs[i].start_ms) / 1000 / dur * W, H); };
  shade(cur, "rgba(80,140,255,.20)"); shade(selI, "rgba(255,170,0,.35)");
  if (peaks) { g.fillStyle = "#6b7a99";
    for (let x = 0; x < W; x++) { const p = peaks[Math.floor(x / W * peaks.length)], h = Math.max(1, p * H * .95);
      g.fillRect(x, (H - h) / 2, 1, h); } }
  g.fillStyle = "rgba(0,0,0,.22)";
  segs.forEach(s => g.fillRect(Math.floor(s.start_ms / 1000 / dur * W), 0, 1, H));
  g.fillStyle = "#e5384f"; g.fillRect(au.currentTime / K / dur * W, 0, 2, H);
}

setInterval(() => {
  const i = segAt(au.currentTime / K);
  if (i !== cur) {
    document.querySelectorAll(".seg.cur").forEach(e => e.classList.remove("cur"));
    cur = i;
    if (i >= 0) {
      const el = $("s" + i); el.classList.add("cur");
      if ($("follow").checked && !au.paused)
        tx.scrollTo({top: el.offsetTop - tx.offsetTop - tx.clientHeight / 3, behavior: "smooth"});
    }
  }
  draw();
}, 100);

async function computePeaks(url) {
  try {
    const buf = await (await fetch(url)).arrayBuffer();
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const ab = await ac.decodeAudioData(buf); ac.close();
    const d = ab.getChannelData(0), N = 2000, step = Math.floor(d.length / N) || 1, out = new Float32Array(N);
    let mx = 0.001;
    for (let i = 0; i < N; i++) {
      let m = 0;
      for (let j = i * step; j < Math.min((i + 1) * step, d.length); j += Math.max(1, step >> 6)) m = Math.max(m, Math.abs(d[j]));
      out[i] = m; mx = Math.max(mx, m);
    }
    for (let i = 0; i < N; i++) out[i] /= mx;
    peaks = out;
  } catch (e) { peaks = null; }
}

au.addEventListener("loadedmetadata", () => {
  K = (isFinite(au.duration) && DUR > 0) ? au.duration / DUR : 1;
  const off = Math.abs(au.duration - DUR);
  if (off < 0.15) K = 1;
  $("diag").textContent = off >= 0.15 ? "⚠ timing corrected (browser length differs by " + off.toFixed(1) + "s)" : "";
  if (resumeT > 0) au.currentTime = Math.min(resumeT * K, au.duration);
  if (resumePlay) au.play().catch(() => {});
});

window.addEventListener("message", ev => {
  const m = ev.data; if (!m || m.type !== "streamlit:render") return;
  const a = m.args, key = JSON.stringify(a.segments);
  DUR = (a.dur_ms || 0) / 1000;
  if (key !== segKey) { segs = a.segments; segKey = key; build(); }
  if (a.ver !== ver) {
    const first = ver === null;
    resumeT = first ? 0 : au.currentTime / K; resumePlay = first ? false : !au.paused;
    ver = a.ver; au.src = a.audio; peaks = null; computePeaks(a.audio);
  }
  post("streamlit:setFrameHeight", {height: 700});
});
post("streamlit:componentReady", {apiVersion: 1});
</script></body></html>
